name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate TTS
        run: |
          mkdir -p public
          edge-tts --text "Halo Arsy, selamat datang di video 9 banding 16 ini." --write-media public/tts.mp3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Render Video
        run: npx remotion render MyComp out/video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
